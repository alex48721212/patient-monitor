<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 찾기 - 환자 모니터링</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="login-page">
<main class="login-box">
    <div class="brand">
        <span class="brand-dot"></span>
        <h1>비밀번호 찾기</h1>
    </div>
    <p id="auth-message" class="login-message" role="alert" hidden></p>
    <form id="reset-request-form">
        <label>아이디 <input name="username" autocomplete="username" required autofocus></label>
        <label>가입한 이메일 <input name="email" type="email" autocomplete="email" required></label>
        <button type="submit" class="btn btn-primary">인증 코드 받기</button>
    </form>
    <form id="reset-confirm-form" hidden>
        <label>인증 코드 (6자리) <input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"></label>
        <label>새 비밀번호 (10자 이상) <input name="newPassword" type="password" autocomplete="new-password" required minlength="10"></label>
        <label>새 비밀번호 확인 <input name="newPasswordConfirm" type="password" autocomplete="new-password" required></label>
        <button type="submit" class="btn btn-primary">비밀번호 변경</button>
    </form>
    <p class="login-links"><a href="login.html">로그인으로 돌아가기</a></p>
</main>
<script src="auth-pages.js"></script>
</body>
</html>
