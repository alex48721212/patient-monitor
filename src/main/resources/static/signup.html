<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 - 환자 모니터링</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="login-page">
<main class="login-box">
    <div class="brand">
        <span class="brand-dot"></span>
        <h1>회원가입</h1>
    </div>
    <p id="auth-message" class="login-message" role="alert" hidden></p>
    <form id="signup-form">
        <label>이름 <input name="name" autocomplete="name" required maxlength="50" autofocus></label>
        <label>이메일 <input name="email" type="email" autocomplete="email" required maxlength="100"></label>
        <label>아이디 <input name="username" autocomplete="username" required minlength="4" maxlength="50"
                          pattern="[A-Za-z0-9_.\-]+" title="영문, 숫자, _ . - 만 사용할 수 있습니다"></label>
        <label>비밀번호 (10자 이상) <input name="password" type="password" autocomplete="new-password" required minlength="10"></label>
        <label>비밀번호 확인 <input name="passwordConfirm" type="password" autocomplete="new-password" required></label>
        <button type="submit" class="btn btn-primary">가입 신청</button>
    </form>
    <p class="login-links"><a href="login.html">로그인으로 돌아가기</a></p>
</main>
<script src="auth-pages.js"></script>
</body>
</html>
